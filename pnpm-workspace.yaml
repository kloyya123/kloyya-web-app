packages:
  - apps/*
  - packages/*

# Native/binary postinstall steps. `true` runs the build; `false` skips it.
# core-js's postinstall only prints a funding ad — nothing to build — so it is
# skipped. The others are real native builds we need.
allowBuilds:
  '@sentry/cli': true # downloads the CLI binary used for source-map upload at build time
  core-js: false
  esbuild: true # vitest's bundler
  sharp: true # next/image optimization
  unrs-resolver: true # eslint import resolution

# Prisma is kept out of the tree by .pnpmfile.cjs (it strips Prisma from
# drizzle-orm's optional peer deps). We use Drizzle via postgres-js, never Prisma.
