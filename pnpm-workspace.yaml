packages:
  - apps/*
  - packages/*

# Native/binary postinstall steps.
allowBuilds:
  esbuild: true # vitest's bundler
  sharp: true # next/image optimization
  unrs-resolver: true # eslint import resolution

# Prisma is kept out of the tree by .pnpmfile.cjs (it strips Prisma from
# drizzle-orm's optional peer deps). We use Drizzle via postgres-js, never Prisma.
