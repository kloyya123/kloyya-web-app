# Render Blueprint for the Kloyya API.
#
# One Docker web service built from the monorepo root. Secrets are declared with
# `sync: false` so Render prompts for them in the dashboard and never stores them
# in this file (which is committed). Non-secret settings carry their value here.
#
# Render injects PORT automatically; config.ts reads it (API_PORT ?? PORT).
#
# First deploy checklist lives in DEPLOY.md — in particular, run the database
# migrations once against DIRECT_URL before the first real traffic.

services:
  - type: web
    name: kloyya-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # ── Non-secret settings ────────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: DOCUMENTS_BUCKET
        value: documents
      - key: PAYMENT_PROVIDER
        value: none
      # Point these at your real hosts once known (see DEPLOY.md).
      - key: BETTER_AUTH_URL
        sync: false # https://<this-api-host>
      - key: WEB_APP_URL
        sync: false # https://<your-vercel-web-host>
      - key: CORS_ALLOWED_ORIGINS
        sync: false # https://<your-vercel-web-host>

      # ── Secrets (set in the Render dashboard) ──────────────────────────────
      - key: DATABASE_URL
        sync: false # Supabase pooler (pgbouncer) URL — app runtime
      - key: DIRECT_URL
        sync: false # Supabase direct URL (5432) — migrations only
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false # required in production — the API refuses to boot without it
      - key: EMAIL_FROM
        sync: false # e.g. "Kloyya <noreply@yourdomain.com>"
      - key: SUPABASE_URL
        sync: false # base origin, no /rest/v1
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # service_role key, NOT anon
      - key: OPENAI_API_KEY
        sync: false
      # OAuth connectors — set the pairs you're enabling, plus their redirect URIs
      # pointing at this API host (https://<this-api-host>/v1/integrations/<p>/callback).
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: MICROSOFT_OAUTH_CLIENT_ID
        sync: false
      - key: MICROSOFT_OAUTH_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_OAUTH_REDIRECT_URI
        sync: false
      - key: NOTION_OAUTH_CLIENT_ID
        sync: false
      - key: NOTION_OAUTH_CLIENT_SECRET
        sync: false
      - key: NOTION_OAUTH_REDIRECT_URI
        sync: false
